
upstream api_server_ssl {
  server 127.0.0.1:5000 fail_timeout=0;
}

upstream mcp_server_ssl {
  server 127.0.0.1:5001 fail_timeout=0;
}

#   server {
#     # if no Host match, close the connection to prevent host spoofing
#     listen 80 default_server;
#     return 444;
#   }

server {
    listen 3443 ssl;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    client_max_body_size 4G;

    server_name _;
    keepalive_timeout 5;
    root /var/www/html;
    index index.html;

    location / {
      # checks for static file, if not found proxy to api
      try_files $uri @proxy_to_api;
    }

    location /mcp {
      # proxy to mcp server
      try_files $uri @proxy_to_mcp;
    }

    location /favicon.ico {
        alias /var/www/html/favicon.ico;
        access_log off;
    }

    location @proxy_to_api {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;
      proxy_pass http://api_server_ssl;
      # timeouts
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 60s;
    }

    location @proxy_to_mcp {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $http_host;
      # we don't want nginx trying to do something clever with
      # redirects, we set the Host: header above already.
      proxy_redirect off;
      proxy_pass http://mcp_server_ssl;
      # timeouts
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 60s;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
      root /var/www/html;
    }
}