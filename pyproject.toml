[project]
name = "mc"
version = "2.4.2"
description = "MissionControl - Launch and manage your containers with ease."
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "celery>=5.5.1",
    "docker>=7.1.0",
    "fastapi>=0.160.0",
    "fastmcp>=2.12.4",
    "flower>=2.0.1",
    "gitpython>=3.1.45",
    "httpx>=0.28.1",
    "objbase>=0.5.2",
    "paramiko>=5.0.0",
    "pexpect>=4.9.0",
    "podman>=5.6.0",
    "prometheus-client>=0.24.1",
    "pydantic>=2.11.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.16.0",
    "python-multipart>=0.0.30",
    "redis>=7.4.0",
    "requests>=2.32.5",
    "uvicorn>=0.50.0",
]

#[tool.uv.sources]
#xscan = { path = "libs/xscan-1.3.1-py3-none-any.whl" }
#rx = { path = "libs/rx-0.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/mc"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "celery-types>=0.23.0",
    "httpx>=0.28.1",
    "pyinstaller>=6.16.0",
    "pytest>=9.1.1",
    "hatchling>=1.29.0",
    "mypy>=2.3.1",
    "pydantic>=2.12.5",
    "pymongo>=4.16.0",
    "pytest-asyncio>=1.3.0",
    "redis>=7.4.0",
    "ruff>=0.16.9",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

# `mypy` checks the library strictly. CI also checks tests and examples with:
#   mypy --allow-untyped-defs --allow-incomplete-defs --allow-untyped-calls tests examples
[tool.mypy]
python_version = "3.14"
files = ["src"]
# resolve project modules from source, not the installed (untyped) package
mypy_path = "src"
strict = true
